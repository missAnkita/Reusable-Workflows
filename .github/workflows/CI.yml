
name: RU WF for CI of .NET application

on:
  workflow_call:
    inputs:
      runs-on:
        description: Platform to execute on
        type: string
        default: ubuntu-latest
        
      dotnet-version:
        description: Version of dotnet to use
        type: string
        default: 8.0.x
      file-name-to-restore:
          description: 'specify a specific filename, examples sln/csproj files to restore. Useful when more than one exist in a single directory'
          required: false
          type: string
      project-folder:
        description: The folder containing the project to build
        type: string
        default: .
        
      run-tests:
        description: Run tests
        type: boolean
        default: true
      
      publish-configuration:
        description: Configuration to publish
        type: string
        default: Release
        
      artifact-name:
        description: Name of the artifact to upload
        type: string
        default: drop
    
jobs:
  build:
    name: Build dotnet app
    
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.project-folder }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
          
      - name: Build Project
        uses: missAnkita/Reusable-Workflows/.github/actions/Build@main
   
      - name: Test Project
        uses: missAnkita/Reusable-Workflows/.github/actions/test@main
      
      - name: Run Application
        uses: missAnkita/Reusable-Workflows/.github/actions/run@main
        
      - name: Publish
        run: dotnet publish -c ${{ inputs.publish-configuration }} -o wdrop
        
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          #path: ${{ inputs.project-folder }}/wdrop/**
          if-no-files-found: error
