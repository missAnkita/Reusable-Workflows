name: 'Build dotnet application image'
on: 
  workflow_dispatch:
#  push: 
#   branches: ["main"]
   
permissions:
    contents: read

jobs:
  build-image-caller:
      uses: missAnkita/Reusable-Workflows/.github/workflows/CD.yml@main
      with:
        working-directory: '.'
        artifact-name: 'artifacts'
        build-artifacts: './k8s'
        aws-region: 'us-west-2'
        container-repository: 'ankita-ecr01'
        image-tag: 'image1'
        deployment-file: 'k8s/deploydotneteks.yml'
      secrets: 
        aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    
            
