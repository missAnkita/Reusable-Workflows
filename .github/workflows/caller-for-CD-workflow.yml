
name: Caller WF to Build Docker Image

on:
  workflow_dispatch:

jobs:
  caller-workflow:
      name: Build .Net app
      uses: missAnkita/Reusable-Workflows/.github/workflows/CD.yml@main
      with:
        working-directory: '.'
