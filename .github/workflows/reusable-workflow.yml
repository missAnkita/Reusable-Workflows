name: Reusable workflow for Flask app

on: 
  workflow_call:
    secrets:
            client-id:
            subscription-id:
            tenant-id:
    inputs:
      framework-version:
        description: 'framework version to install'
        required: true
        type: string
      working-directory:
        description: 'working directory for App code'
        required: true
        type: string
      framework-type:
        description: 'The type of framework or service'
        required: true
        default: flask
        type: string
      requirements-path:
        description: 'Path to the requirements.txt file'
        required: false
        default: "requirements.txt"
        type: string
      file-name-to-test:
        description: 'specify specific sln/proj/py to test'
        required: true
        type: string
      publish-directory:
        description: 'directory to publish package'
        required: true
        type: string
      function-app-name:
        description: 'name of the azure function app'
        required: true
        default: test-app0099
        type: string 
      artifact-name:
        description: 'artifact name'
        required: true
        type: string 

jobs:
  Build:  
    runs-on: ubuntu-latest
    steps:
    - name: checkout 
      uses: missAnkita/Reusable-Workflows/.github/actions/checkout@feature/test-multilingual
    
    - name: security scan
      uses: missAnkita/Reusable-Workflows/.github/actions/security-scan@feature/test-multilingual

    - name: setup frameworks
      uses: missAnkita/Reusable-Workflows/.github/actions/setup-framework@feature/test-multilingual
      with: 
        framework-version: ${{ inputs.framework-version}}
        framework-type: ${{ github.event.inputs.framework-type }}

    - name: install dependencies
      uses: missAnkita/Reusable-Workflows/.github/actions/install-dependencies@feature/test-multilingual
      with: 
        working-directory: ${{ inputs.working-directory}}
        framework-version: ${{ inputs.framework-version}}
        framework-type: ${{ github.event.inputs.framework-type }}
        requirements-path: ${{ inputs.requirements-path}}

    - name: build
      if: ${{ inputs.framework-type != 'python' }}
      uses: missAnkita/Reusable-Workflows/.github/actions/build@feature/test-multilingual
      with: 
        working-directory: ${{ inputs.working-directory}}
        framework-type: ${{ github.event.inputs.framework-type }}
      
    - name: test
      if: ${{ inputs.framework-type == 'python' }}
      uses: missAnkita/Reusable-Workflows/.github/actions/test@feature/test-multilingual
      with: 
        working-directory: ${{ inputs.working-directory}}
        framework-type: ${{ github.event.inputs.framework-type }}
        file-name-to-test: ${{ inputs.file-name-to-test }}


    - name: package
      if: ${{ inputs.framework-type != 'python' }}
      uses: missAnkita/Reusable-Workflows/.github/actions/package@feature/test-multilingual
      with: 
        working-directory: ${{ inputs.working-directory}}
        #steps which needs check the language type ----5----
        framework-type: ${{ github.event.inputs.framework-type }}

    - name: publish artifacts
      if: ${{ inputs.framework-type != 'python' }}
      uses: missAnkita/Reusable-Workflows/.github/actions/publish@feature/test-multilingual
      with: 
        publish-directory: ${{ inputs.publish-directory}}

  Deploy:    
    runs-on: ubuntu-latest
    needs: [ "Build"]
    steps:     
     - name: download-artifact
       if: ${{ inputs.framework-type != 'python' }} 
       uses: missAnkita/Reusable-Workflows/.github/actions/download-artifact@feature/test-multilingual
       with: 
        artifact-name: ${{ inputs.artifact-name }}
        
     - name: login to azure
       if: ${{ inputs.framework-type != 'python' }}
       uses: missAnkita/Reusable-Workflows/.github/actions/azlogin@feature/test-multilingual
       with:
        client-id: ${{ inputs.client-id }}
        tenant-id: ${{ inputs.tenant-id }}
        subscription-id: ${{ inputs.subscription-id }}

     - name: deploy
       if: ${{ inputs.framework-type != 'python' }}
       uses: missAnkita/Reusable-Workflows/.github/actions/deploy@feature/test-multilingual
       with: 
        function-app-name: ${{ inputs.function-app-name }}
        #steps which needs check the language type ----6----
        framework: ${{ github.event.inputs.framework }}
