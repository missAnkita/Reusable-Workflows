
name: RU WF for linting Azure Functions .NET App

on:
  workflow_call:
    inputs:
      runs-on:
        description: Platform to execute on
        type: string
        default: ubuntu-latest
      
      working-directory:
        description: The folder containing the project to build
        type: string
        default: .
        
      run-tests:
        description: Run tests
        type: boolean
        default: true

      filter-regex-include:
        description: 'specifies the files to be included in the linting'
        required: false
        type: string
      filter-regex-exclude:
        description: 'specifies the files to be excluded from linting'
        required: false
        type: string
      validate-jscpd: 
        description: 'Enable/disable jscpd from linting'
        required: false
        type: string
      validate-checkov: 
        description: 'Enable/disable checkov from linting'
        required: false
        type: string
jobs:
  lint:
    name: Lint dotnet app
    
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List Files
        run: ls -R ${{ inputs.working-directory }}

      - name: Super Linter Code Base
        uses: missAnkita/Reusable-Workflows/.github/actions/Super-Linter@feature/test-sprinter
        env:
              #VALIDATE_ALL_CODEBASE: false
              FILTER_REGEX_INCLUDE: ${{ inputs.filter-regex-include }}
              FILTER_REGEX_EXCLUDE: ${{ inputs.filter-regex-exclude}}   
              VALIDATE_JSCPD: ${{ inputs.validate-jscpd }}   
              VALIDATE_CHECKOV: ${{ inputs.validate-checkov }}
              MULTI_STATUS: false
         # FILTER_REGEX_INCLUDE: .*\.(cs|js|sh)$
         # MULTI_STATUS: false
          # VALIDATE_YAML: false
         # FILTER_REGEX_EXCLUDE: .*\.github/workflows/caller\-sl\.yml, .*\.(html)$
          #FILTER_REGEX_EXCLUDE: ^(?!.*\.github/).*

        
