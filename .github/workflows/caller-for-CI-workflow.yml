
name: Caller CI WF For .Net App

on:
  workflow_dispatch:

jobs:
  caller-workflow:
      name: Build .Net app
      uses: missAnkita/Reusable-Workflows/.github/workflows/CI.yml@main
      with:
        runs-on: ubuntu-latest
        run-tests: false
        project-folder: .
        artifact-name: 'artifacts'
        build-artifacts: './k8s'
        file-name-to-restore: './dotnetapp.sln'
      secrets: inherit

    
            
