name: Install Python Dependencies
description: A composite action to install Python dependencies from requirements.txt
inputs:
  framework-type:
    description: 'The type of framework'
    required: true
    default: flask
    type: string
  framework-version:
    description: "Python version to use"
    required: true
  working-directory:
        description: 'working directory for App code'
        required: true
        type: string
  requirements-path:
    description: "Path to the requirements.txt file"
    required: false
    default: "requirements.txt"

runs:
  using: "composite"
  steps:
   - name: Setup NuGet.exe
     if: ${{ inputs.framework-type == 'dotnet' || inputs.framework-type == 'blazor' }}
     uses: nuget/setup-nuget@v2
     with:
       nuget-version: ${{ inputs.framework-version }}

   - name: Install npm
     if: ${{ inputs.framework-type == 'angular' }}
     run: npm install
     shell: bash
     working-directory: ${{ inputs.working-directory }}


   - name: Upgrade pip and install dependencies
     if: ${{ inputs.framework-type == 'python' }}
     run: |
        python -m pip install --upgrade pip
        pip install -r ${{ inputs.requirements-path }}
     shell: bash