name: 'EKS Deploy'
description: 'Deploy to EKS'
inputs:
  deployment-file:
    description: 'Path of the deployment.yml file'
    required: false
    type: string
  aws-region:
    description: 'AWS region where the EKS cluster is located'
    required: false
    type: string
  cluster-name:
    description: 'Name of the EKS cluster'
    required: false
    type: string
runs:
  using: 'composite'
  steps:
    - name: Download and install kubectl
      shell: bash
      run: |
        if command -v kubectl; then
        echo "kubectl is already installed. Skipping installation."
        else
        echo "kubectl not found. Installing..."
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/
        fi
        
    - name: Update kube config for EKS
      run: |
        aws eks update-kubeconfig --name ${{ inputs.cluster-name }} --region ${{ inputs.aws-region }}
      shell: bash

    - name: Deploy Image to EKS
      run: |
        kubectl apply -f ${{ inputs.deployment-file }}
      shell: bash