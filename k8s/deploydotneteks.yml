apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dotnet
  template:
    metadata:
      labels:
        app: dotnet
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
        - key: "CriticalAddonsOnly"
          operator: "Exists"
      containers:
      - name: dotnet-container
        image: 677276094190.dkr.ecr.us-west-2.amazonaws.com/ankita-ecr01:image1
        ports:
        - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: dotnet-service
  labels:
    app: dotnet
spec:
  selector:
    app: dotnet
  ports:
    - protocol: TCP
      port: 8080       # Port exposed within the cluster
      targetPort: 8080 # Port inside the container
  type: ClusterIP    # Internal service (default)